{% extends 'usuarios/base.html' %}
{% load static %}

{% block content %}
<style>
    /* Contenedor principal a pantalla completa con fondo de laboratorio submarino */
    .game-fullscreen {
        width: 100vw;
        min-height: calc(100vh - 60px);
        margin-left: calc(-50vw + 50%);
        margin-right: calc(-50vw + 50%);
        background: radial-gradient(circle at center, #162938 0%, #0b141c 100%);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px 30px;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #fff;
    }

    /* Barra superior idéntica a los demás niveles */
    .game-top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 600px;
        width: 100%;
        margin: 0 auto;
        padding-bottom: 15px;
    }

    .back-arrow {
        color: #f1c40f;
        text-decoration: none;
        font-size: 1.8rem;
        font-weight: bold;
    }

    .level-indicator {
        font-size: 1.1rem;
        color: #f5f5f5;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .game-stats-header {
        display: flex;
        gap: 15px;
        font-weight: bold;
        font-size: 1rem;
    }

    /* Contenedor central del juego */
    .game-main-container {
        max-width: 520px;
        width: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
        flex-grow: 1;
        justify-content: center;
    }

    /* Tarjeta de Objetivo / Atmósferas */
    .objective-card {
        background: #111d28;
        border: 2px solid #d4af37;
        border-radius: 14px;
        padding: 15px 20px;
        text-align: left;
        box-shadow: 0 6px 15px rgba(0,0,0,0.4);
    }
    .objective-card span.label-obj {
        font-size: 0.75rem;
        color: #d4af37;
        letter-spacing: 2px;
        font-weight: bold;
        display: block;
        margin-bottom: 4px;
        text-transform: uppercase;
    }
    .objective-card p {
        font-size: 0.9rem;
        color: #cbd5e0;
        margin: 0;
        line-height: 1.3;
    }

    /* Panel principal de opciones de paletas */
    .palettes-panel {
        background: #111d28;
        border: 2px solid #2c4a60;
        border-radius: 16px;
        padding: 15px 20px;
        text-align: center;
        box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .panel-instruction {
        font-size: 0.75rem;
        color: #94a3b8;
        margin: 0 0 12px 0;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    /* Lista vertical de filas de paletas */
    .palettes-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .palette-row {
        background: #162636;
        border: 2px solid #334e68;
        border-radius: 12px;
        padding: 10px 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        transition: transform 0.15s, border-color 0.15s;
    }
    .palette-row:hover {
        border-color: #d4af37;
        transform: translateY(-2px);
    }

    /* Contenedor de los 5 bloques de color de la paleta */
    .color-swatches-group {
        display: flex;
        gap: 8px;
    }

    .swatch {
        width: 32px;
        height: 38px;
        border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.3);
        box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    /* Radio button estilizado */
    .palette-radio {
        width: 20px;
        height: 20px;
        accent-color: #f1c40f;
        cursor: pointer;
    }

    /* Botón Comprobar inferior */
    .footer-action {
        max-width: 520px;
        width: 100%;
        margin: 0 auto;
        padding-top: 5px;
    }

    .btn-comprobar {
        width: 100%;
        background: linear-gradient(to bottom, #2ecc71, #27ae60);
        color: white;
        border: 3px solid #145a32;
        padding: 14px;
        font-size: 1.2rem;
        font-weight: 800;
        text-transform: uppercase;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 6px 0px #145a32;
        letter-spacing: 1px;
        transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-comprobar:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0px #145a32;
    }

    /* Responsividad inteligente */
    @media (max-width: 600px) {
        .game-fullscreen { padding: 15px; }
        .swatch { width: 26px; height: 32px; gap: 5px; }
    }
</style>

<div class="game-fullscreen">
    <!-- Barra Superior -->
    <div class="game-top-bar">
        <a href="{% url 'mapa_niveles' %}" class="back-arrow">←</a>
        <span class="level-indicator">Atmósferas - Nivel {{ numero_nivel }}</span>
        <div class="game-stats-header">
            <span>❤️ 5</span>
            <span>💎 810</span>
        </div>
    </div>

    <!-- Contenedor Central -->
    <div class="game-main-container">
        <!-- Tarjeta de Objetivo -->
        <div class="objective-card">
            <span class="label-obj">ATMÓSFERAS</span>
            <p>El director de arte solicita una paleta que transmita la atmósfera de <strong>'CYBERPUNK NEÓN'</strong>. Elige la opción idónea:</p>
        </div>

        <!-- Panel de Opciones de Paletas -->
        <div class="palettes-panel">
            <p class="panel-instruction">Opciones de paletas de color:</p>

            <div class="palettes-list">
                <!-- Fila 1 (Tonos Tierra/Neutros) -->
                <div class="palette-row">
                    <div class="color-swatches-group">
                        <div class="swatch" style="background-color: #8b4513;"></div>
                        <div class="swatch" style="background-color: #deb887;"></div>
                        <div class="swatch" style="background-color: #fdf5e6;"></div>
                        <div class="swatch" style="background-color: #fffaf0;"></div>
                        <div class="swatch" style="background-color: #faebd7;"></div>
                    </div>
                    <input type="radio" name="paleta" class="palette-radio">
                </div>

                <!-- Fila 2 (Tonos Verdes/Naturaleza) -->
                <div class="palette-row">
                    <div class="color-swatches-group">
                        <div class="swatch" style="background-color: #27ae60;"></div>
                        <div class="swatch" style="background-color: #2ecc71;"></div>
                        <div class="swatch" style="background-color: #1e8449;"></div>
                        <div class="swatch" style="background-color: #d4efdf;"></div>
                        <div class="swatch" style="background-color: #e8f8f5;"></div>
                    </div>
                    <input type="radio" name="paleta" class="palette-radio">
                </div>

                <!-- Fila 3 (Tonos Cálidos/Pastel) -->
                <div class="palette-row">
                    <div class="color-swatches-group">
                        <div class="swatch" style="background-color: #e74c3c;"></div>
                        <div class="swatch" style="background-color: #e84393;"></div>
                        <div class="swatch" style="background-color: #8e44ad;"></div>
                        <div class="swatch" style="background-color: #c0392b;"></div>
                        <div class="swatch" style="background-color: #ffcccc;"></div>
                    </div>
                    <input type="radio" name="paleta" class="palette-radio">
                </div>

                <!-- Fila 4 (Correcta Cyberpunk Neón) -->
                <div class="palette-row" style="border-color: #f1c40f;">
                    <div class="color-swatches-group">
                        <div class="swatch" style="background-color: #ff007f;"></div>
                        <div class="swatch" style="background-color: #00f0ff;"></div>
                        <div class="swatch" style="background-color: #9b59b6;"></div>
                        <div class="swatch" style="background-color: #0c0032;"></div>
                        <div class="swatch" style="background-color: #ffffff;"></div>
                    </div>
                    <input type="radio" name="paleta" class="palette-radio" checked>
                </div>
            </div>
        </div>
    </div>

    <!-- Botón Inferior -->
    <div class="footer-action">
        <button class="btn-comprobar">COMPROBAR</button>
    </div>
</div>
{% endblock %}
