{% extends 'usuarios/base.html' %}
{% load static %}

{% block content %}
<style>
    /* Contenedor principal a pantalla completa con fondo de laboratorio submarino */
    .game-fullscreen {
        width: 100vw;
        min-height: calc(100vh - 60px);
        margin-left: calc(-50vw + 50%);
        margin-right: calc(-50vw + 50%);
        background: radial-gradient(circle at center, #162938 0%, #0b141c 100%);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px 30px;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #fff;
    }

    /* Barra superior idéntica a la referencia */
    .game-top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 600px;
        width: 100%;
        margin: 0 auto;
        padding-bottom: 15px;
    }

    .back-arrow {
        color: #f1c40f;
        text-decoration: none;
        font-size: 1.8rem;
        font-weight: bold;
    }

    .level-indicator {
        font-size: 1.1rem;
        color: #f5f5f5;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .game-stats-header {
        display: flex;
        gap: 15px;
        font-weight: bold;
        font-size: 1rem;
    }

    /* Contenedor central del juego */
    .game-main-container {
        max-width: 520px;
        width: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
        flex-grow: 1;
        justify-content: center;
    }

    /* Tarjeta de Objetivo / Contraste */
    .objective-card {
        background: #111d28;
        border: 2px solid #d4af37;
        border-radius: 14px;
        padding: 20px;
        text-align: left;
        box-shadow: 0 6px 15px rgba(0,0,0,0.4);
    }
    .objective-card span.label-obj {
        font-size: 0.75rem;
        color: #d4af37;
        letter-spacing: 2px;
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
        text-transform: uppercase;
    }
    .objective-card p {
        font-size: 0.95rem;
        color: #cbd5e0;
        margin: 0;
        line-height: 1.4;
    }

    /* Panel principal de prueba de contraste */
    .contrast-panel {
        background: #111d28;
        border: 2px solid #2c4a60;
        border-radius: 16px;
        padding: 25px 20px;
        text-align: center;
        box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    /* Caja de vista previa oscura */
    .preview-dark-box {
        background: #0e1c26;
        border: 2px solid #243b52;
        border-radius: 12px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        box-shadow: inset 0 3px 8px rgba(0,0,0,0.5);
        padding: 0 20px;
        text-align: center;
    }
    .preview-dark-box span {
        font-size: 0.9rem;
        color: #627d98;
    }

    .panel-instruction {
        font-size: 0.85rem;
        color: #94a3b8;
        margin: 0 0 15px 0;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }

    /* Cuadrícula de opciones de texto */
    .options-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        justify-content: center;
        margin-bottom: 12px;
    }

    .option-color-btn {
        height: 65px;
        border-radius: 14px;
        border: 3px solid #334e68;
        cursor: pointer;
        transition: transform 0.15s, border-color 0.15s;
        box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .option-color-btn:hover {
        border-color: #d4af37;
        transform: translateY(-2px);
    }

    /* Opción centrada inferior extra si es necesaria */
    .single-option-container {
        display: flex;
        justify-content: center;
    }
    .single-option-container .option-color-btn {
        width: 100px;
    }

    /* Botón Comprobar inferior */
    .footer-action {
        max-width: 520px;
        width: 100%;
        margin: 0 auto;
        padding-top: 10px;
    }

    .btn-comprobar {
        width: 100%;
        background: linear-gradient(to bottom, #2ecc71, #27ae60);
        color: white;
        border: 3px solid #145a32;
        padding: 15px;
        font-size: 1.25rem;
        font-weight: 800;
        text-transform: uppercase;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 6px 0px #145a32;
        letter-spacing: 1px;
        transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-comprobar:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0px #145a32;
    }

    /* Responsividad inteligente */
    @media (max-width: 600px) {
        .game-fullscreen { padding: 15px; }
        .preview-dark-box { height: 100px; }
        .option-color-btn { height: 55px; }
    }
</style>

<div class="game-fullscreen">
    <!-- Barra Superior -->
    <div class="game-top-bar">
        <a href="{% url 'mapa_niveles' %}" class="back-arrow">←</a>
        <span class="level-indicator">Contraste - Nivel {{ numero_nivel }}</span>
        <div class="game-stats-header">
            <span>❤️ 5</span>
            <span>💎 810</span>
        </div>
    </div>

    <!-- Contenedor Central -->
    <div class="game-main-container">
        <!-- Tarjeta de Objetivo -->
        <div class="objective-card">
            <span class="label-obj">CONTRASTE</span>
            <p>Elige el color de texto que mejor resalta sobre este fondo oscuro:</p>
        </div>

        <!-- Panel Principal de Contraste -->
        <div class="contrast-panel">
            <div class="preview-dark-box">
                <span>Selecciona una opción para probar</span>
            </div>

            <p class="panel-instruction">Opciones de color de texto:</p>

            <div class="options-grid">
                <div class="option-color-btn" style="background-color: #5c2c16;"></div>
                <div class="option-color-btn" style="background-color: #222222;"></div>
                <div class="option-color-btn" style="background-color: #bce0fd;"></div>
            </div>

            <div class="single-option-container">
                <div class="option-color-btn" style="background-color: #1e4d5b; width: 110px;"></div>
            </div>
        </div>
    </div>

    <!-- Botón Inferior -->
    <div class="footer-action">
        <button class="btn-comprobar">COMPROBAR</button>
    </div>
</div>
{% endblock %}
