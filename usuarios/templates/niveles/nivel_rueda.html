{% extends 'usuarios/base.html' %}
{% load static %}

{% block content %}
<div class="game-fullscreen">
    <!-- Barra Superior -->
    <div class="game-top-bar">
        <a href="{% url 'mapa_niveles' %}" class="back-arrow">←</a>
        <span class="level-indicator">Contraste - Nivel {{ numero_nivel }}</span>
        <div class="game-stats-header">
            <span>❤️ 5</span>
            <span>💎 810</span>
        </div>
    </div>

    <!-- Contenedor Central -->
    <div class="game-main-container">
        <!-- Tarjeta de Objetivo -->
        <div class="objective-card">
            <span class="label-obj">CONTRASTE</span>
            <p>Elige el color de texto que mejor resalta sobre este fondo oscuro:</p>
        </div>

        <!-- Panel Principal de Contraste -->
        <div class="contrast-panel">
            <div class="preview-dark-box">
                <span>Selecciona una opción para probar</span>
            </div>

            <p class="panel-instruction">Opciones de color de texto:</p>

            <div class="options-grid">
                <div class="option-color-btn" style="background-color: #5c2c16;"></div>
                <div class="option-color-btn" style="background-color: #222222;"></div>
                <div class="option-color-btn" style="background-color: #bce0fd;"></div>
            </div>

            <div class="single-option-container">
                <div class="option-color-btn" style="background-color: #1e4d5b; width: 110px;"></div>
            </div>
        </div>
    </div>

    <!-- Botón Inferior -->
    <div class="footer-action">
        <button class="btn-comprobar">COMPROBAR</button>
    </div>
</div>
{% endblock %}
