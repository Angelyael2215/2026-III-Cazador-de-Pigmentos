<a class="app-skip-link" href="#main-content">Saltar al contenido principal</a>
<nav class="app-navigation" aria-label="Navegación principal">
    <a class="app-navigation__brand"
       href="{% url 'bienvenida_jugador' %}"
       aria-label="Cazadores de Pigmentos, ir a jugar">
        <span class="app-navigation__brand-mark" aria-hidden="true">
            <svg class="icon"><use href="#icon-sparkle"></use></svg>
        </span>
        <span class="app-navigation__brand-copy">
            <strong>Cazadores</strong>
            <small>de pigmentos</small>
        </span>
    </a>
    <div class="app-navigation__links">
        <a href="{% url 'bienvenida_jugador' %}"
           {% if app_navigation_is_game_current %}aria-current="page"{% endif %}>
            <span class="app-navigation__icon" aria-hidden="true">
                <svg class="icon"><use href="#icon-home"></use></svg>
            </span>
            <span class="app-navigation__label">Jugar</span>
        </a>
        <a href="{% url 'mapa_niveles' %}"
           {% if request.resolver_match.url_name == 'mapa_niveles' %}aria-current="page"{% endif %}>
            <span class="app-navigation__icon" aria-hidden="true">
                <svg class="icon"><use href="#icon-map"></use></svg>
            </span>
            <span class="app-navigation__label">Mapa</span>
        </a>
        {% if app_has_management_access %}
            <a href="{% url 'dashboard_admin' %}"
               {% if app_navigation_is_dashboard_current %}aria-current="page"{% endif %}>
                <span class="app-navigation__icon" aria-hidden="true">
                    <svg class="icon"><use href="#icon-shield"></use></svg>
                </span>
                <span class="app-navigation__label">Panel</span>
            </a>
            {% if app_navigation_sections %}
                <details class="app-navigation__management">
                    <summary>
                        <span class="app-navigation__icon" aria-hidden="true">
                            <svg class="icon"><use href="#icon-levels"></use></svg>
                        </span>
                        <span class="app-navigation__label">Gestión</span>
                    </summary>
                    <div class="app-navigation__menu">
                        {% for section in app_navigation_sections %}
                            <a href="{% url section.url_name %}"
                               {% if section.is_current %}aria-current="page"{% endif %}>
                                <span class="app-navigation__menu-icon" aria-hidden="true">
                                    <svg class="icon">
                                        {% if section.label == 'Permisos' %}<use href="#icon-key"></use>
                                        {% elif section.label == 'Roles' %}<use href="#icon-shield"></use>
                                        {% elif section.label == 'Usuarios' %}<use href="#icon-users"></use>
                                        {% elif section.label == 'Perfiles' %}<use href="#icon-user"></use>
                                        {% elif section.label == 'Evaluaciones de accesibilidad' %}<use href="#icon-eye"></use>
                                        {% elif section.label == 'Niveles del juego' %}<use href="#icon-levels"></use>
                                        {% elif section.label == 'Niveles' %}<use href="#icon-map"></use>
                                        {% elif section.label == 'Progresos' %}<use href="#icon-file"></use>
                                        {% elif section.label == 'Logros' %}<use href="#icon-trophy"></use>
                                        {% elif section.label == 'Logros de usuarios' %}<use href="#icon-award"></use>
                                        {% else %}<use href="#icon-sparkle"></use>{% endif %}
                                    </svg>
                                </span>
                                <span>{{ section.label }}</span>
                            </a>
                        {% endfor %}
                    </div>
                </details>
            {% endif %}
        {% endif %}
    </div>

    <div class="app-navigation__account">
        <a class="app-navigation__username"
           href="{% url 'cuenta_jugador' %}"
           aria-label="Ver cuenta de {{ request.user.username }}">
            <svg class="icon" aria-hidden="true"><use href="#icon-user"></use></svg>
            <span>{{ request.user.username }}</span>
        </a>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" aria-label="Cerrar sesión">
                <svg class="icon" aria-hidden="true"><use href="#icon-logout"></use></svg>
                <span>Cerrar sesión</span>
            </button>
        </form>
    </div>
</nav>
